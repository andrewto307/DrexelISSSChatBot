<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ISSS Assistant · Unofficial</title>
    <meta name="description" content="An unofficial assistant that answers international students' questions from the Drexel ISSS website, with links to the pages it uses.">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/vendor/marked.umd.js" defer></script>
    <script src="/static/vendor/purify.min.js" defer></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/></svg>
          </span>
          <span class="brand-name">ISSS Assistant</span>
          <span class="pill">Unofficial</span>
        </div>
        <div class="topbar-actions">
          <div class="theme-switch" role="radiogroup" aria-label="Color theme">
            <button type="button" role="radio" aria-checked="false" aria-label="Light theme" data-theme-choice="light">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
              <span class="theme-label">Light</span>
            </button>
            <button type="button" role="radio" aria-checked="false" aria-label="Dark theme" data-theme-choice="dark">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
              <span class="theme-label">Dark</span>
            </button>
            <button type="button" role="radio" aria-checked="false" aria-label="Match system theme" data-theme-choice="system">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
              <span class="theme-label">System</span>
            </button>
          </div>
          <button type="button" class="button new-chat" id="new-chat" aria-label="New chat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="new-chat-label">New chat</span>
          </button>
        </div>
      </header>

      <main class="main">
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
          <h1 id="welcome-title">Questions about your student visa status at Drexel?</h1>
          <p class="welcome-lead">Ask in any language. Answers come only from the ISSS website and link to the pages they use.</p>
          <p class="examples-label" id="examples-label">Try asking</p>
          <ul class="examples" aria-labelledby="examples-label">
            <li><button type="button" class="example"><span>Can I do CPT in my first year?</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></li>
            <li><button type="button" class="example"><span>How do I apply for OPT?</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></li>
            <li><button type="button" class="example"><span>What documents do I need to re-enter the U.S. after traveling?</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></li>
            <li><button type="button" class="example"><span>What's the latest on the duration of status rule?</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></li>
          </ul>
        </section>
        <noscript><p>This assistant needs JavaScript to work.</p></noscript>
        <ol class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation"></ol>
      </main>

      <footer class="composer-area">
        <div class="composer-inner">
          <form class="composer" id="composer">
            <label for="question" class="visually-hidden">Your question</label>
            <textarea id="question" name="question" rows="1" maxlength="1000" placeholder="Ask about CPT, OPT, travel…" autocomplete="off"></textarea>
            <button type="submit" class="send-button" id="send" aria-label="Send question" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </form>
          <div class="composer-meta">
            <span>Unofficial assistant · not legal advice · confirm important decisions with <a href="https://drexel.edu/studentlife/student-success/international-student-support" target="_blank" rel="noopener noreferrer">ISSS</a></span>
            <span class="char-count" id="char-count" hidden></span>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
