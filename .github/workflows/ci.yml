name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: isss
          POSTGRES_PASSWORD: isss_ci
          POSTGRES_DB: isss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isss -d isss_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://isss:isss_ci@localhost:5432/isss_test
      TEST_DATABASE_URL: postgresql://isss:isss_ci@localhost:5432/isss_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -q
