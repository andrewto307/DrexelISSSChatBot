name: isss-chatbot

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: isss
      POSTGRES_PASSWORD: isss_local_dev
      POSTGRES_DB: isss
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isss -d isss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
