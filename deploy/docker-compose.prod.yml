name: drxl-chatbot

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: ${ENV_DIR:-/etc/drxl-chatbot}/db.env
    environment:
      POSTGRES_USER: isss
      POSTGRES_DB: isss
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isss -d isss"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    image: ${APP_IMAGE:?set APP_IMAGE to the image to run}
    restart: unless-stopped
    env_file: ${ENV_DIR:-/etc/drxl-chatbot}/app.env
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    networks:
      - internal
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS to the site's domain}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      web:
        ipv4_address: 172.30.0.10

networks:
  internal:
    internal: true
  web:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
